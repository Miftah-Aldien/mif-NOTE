name: Build mif-NOTE C++ (Notepad++ engine)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (Win32 / x86 untuk EeePC 32-bit)
        shell: pwsh
        run: cmake -S . -B build -A Win32
      - name: Build mif-NOTE (x86, static - tanpa MSVCP140.dll)
        shell: pwsh
        run: |
          cmake --build build --config Release
          Get-ChildItem build/Release
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: mif-note-cpp-x86
          path: build/Release/Mif-NOTE.exe
