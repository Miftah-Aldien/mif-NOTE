name: Build mif-NOTE C++ (Notepad++ engine)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Scintilla (mesin Notepad++)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.scintilla.org/scintilla541.zip" -OutFile scintilla.zip
          Expand-Archive scintilla.zip -DestinationPath scintilla -Force
          dir scintilla
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release
      - name: Copy SciLexer.dll
        shell: pwsh
        run: |
          Copy-Item scintilla/bin/SciLexer.dll build/Release/ -ErrorAction SilentlyContinue
          dir build/Release
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: mif-note-cpp
          path: |
            build/Release/Mif-NOTE.exe
            build/Release/SciLexer.dll
